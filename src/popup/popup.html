<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Overview</title>
  <link rel="stylesheet" href="../core/design-system/design-system.css">
  <!--
    UI 文字 SSOT：src/popup/constants/ui-text.js
    本檔內中文文字為無 JS fallback；執行時由 popup.js applyStaticUIText() 以常數覆寫。
    維護文字請改常數檔，本檔同步即可。
    尺寸常數（width 350 / min-height 400）對應 src/popup/constants/layout.js POPUP_DIMENSIONS。
    版面依目前分頁替換主動作（body[data-context]：library / store / none），
    元件樣式在 src/core/design-system/component-rules.js 的 .popup-shell 區段。
  -->
  <style>
    body {
      width: 350px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--color-primary-darkest);
      color: var(--color-surface);
    }

    .header {
      display: flex;
      align-items: baseline;
      gap: var(--spacing-sm);
      padding: var(--spacing-md) var(--spacing-lg) 0;
    }

    .header h1 {
      margin: 0;
      font-size: var(--font-size-body-small);
      font-weight: var(--font-weight-semi-bold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-primary-light);
    }

    .header p {
      margin: 0;
      flex: 1;
      font-size: var(--font-size-body-small);
      color: var(--color-primary-light);
    }

    .content {
      padding: var(--spacing-lg) var(--spacing-lg) 0;
    }

    .version {
      font-size: var(--font-size-caption);
      color: var(--color-primary-light);
      padding: var(--spacing-lg) var(--spacing-lg) var(--spacing-md);
    }
  </style>
</head>
<!--
  共用元件樣式（卡片 / 狀態指示 / 按鈕 / 文字 / 標頭 / 進度條 / 摺疊元件）
  已遷入 design-system.css（來源 SSOT：src/core/design-system/component-rules.js，
  1.5.0-W6-001）。本檔 <style> 僅保留頁面專屬佈局豁免規則。
-->
<body class="popup-shell" data-context="none">

  <div class="header">
    <h1>Book Overview</h1>
    <p>電子書庫總覽</p>
    <button class="menu-toggle" id="menuBtn" type="button" aria-expanded="false" aria-controls="popupMenu" aria-label="更多操作：匯入書庫、其他書城">選單</button>
  </div>

  <!-- 選單：匯入書庫、其他書城；設定與說明尚未實作，按鈕保留但不顯示 -->
  <div class="popup-menu" id="popupMenu" hidden>
    <button class="button ghost menu-item" id="importBtn" aria-label="從 JSON 檔案匯入書庫資料">
      匯入書庫
    </button>
    <input type="file" id="importFileInput" accept=".json" style="display: none;" aria-hidden="true">
    <!-- 書城清單掛載點（由 popup.js 以 ui-factory 動態建立；不在書城時搬到主動作的位置） -->
    <div id="bookstoreNavMount"></div>
    <button class="button ghost menu-item" id="settingsBtn" hidden>擴充功能設定</button>
    <button class="button ghost menu-item" id="helpBtn" hidden>使用說明</button>
    <button class="button ghost menu-item" id="diagnosticBtn" style="display: none;">診斷模式</button>
  </div>

  <div class="content">
    <!-- 這個分頁：書城名稱、本數與唯一的主動作 -->
    <section class="context" aria-labelledby="contextTitle">
      <h2 class="context-title" id="contextTitle"></h2>
      <p class="context-count" id="bookCountLine" data-empty="true"><span id="bookCount">-</span><span id="bookCountUnit"> 本</span></p>

      <div class="keycap-slot">
        <button class="button primary keycap" id="extractBtn" disabled>
          開始提取書庫資料
        </button>
        <button class="button primary keycap" id="gotoLibraryBtn" type="button" hidden>前往書櫃</button>
        <!-- 按鍵即進度：提取中與完成時取代提取鍵；不顯示百分比（popup 收不到真實進度） -->
        <div class="keycap keycap-face" id="extractFace" hidden role="status" aria-live="polite">
          <span class="keycap-fill" aria-hidden="true"></span>
          <span class="keycap-label" id="extractFaceText"></span>
        </div>
        <div class="context-stores" id="storeKeysMount"></div>
      </div>
      <p class="extract-hint" id="extractHint" hidden>請保持這個分頁開著</p>
      <button class="button ghost cancel-extract" id="cancelExtractBtn" type="button" hidden>取消提取</button>
      <!-- 只在需要使用者留意時顯示（連線中、錯誤、取消）；就緒時不顯示 -->
      <div class="status-notice" id="statusNotice" data-status="loading" role="status" aria-live="polite">
        <div class="status-indicator">
          <div class="status-dot loading" id="statusDot"></div>
          <span id="statusText">正在檢查狀態...</span>
        </div>
        <div class="info-text" id="statusInfo">
          請稍候，正在初始化擴充功能
        </div>
      </div>

      <!-- 錯誤訊息區域（按鈕收斂為 1 primary 重試 + 1 secondary 重新載入） -->
      <div class="status-card error-card" id="errorContainer" style="display: none;">
        <div class="error-header">
          <strong>錯誤訊息</strong>
        </div>
        <div class="error-message" id="errorMessage">
          發生未知錯誤
        </div>
        <div class="action-buttons">
          <button class="button primary small" id="retryBtn">
            重試
          </button>
          <button class="button secondary small" id="reloadExtensionBtn">
            重新載入擴充功能
          </button>
        </div>
        <div class="error-suggestions" id="errorSuggestions" style="display: none;">
          <div class="info-text">
            <strong>建議解決步驟：</strong>
            <ol id="suggestionsList"></ol>
          </div>
        </div>
      </div>
    </section>

    <button class="button secondary keycap-outline" id="viewLibraryBtn" aria-label="開啟書庫總覽頁面檢視所有書籍">
      檢視書庫
    </button>

    <!-- 初始化與舊流程的進度區：初始化追蹤器仍寫入；新版面由上方通知區與鍵面表達，容器不顯示 -->
    <div class="legacy-progress" hidden>
    <div class="status-card" id="progressContainer" style="display: none;">
      <div class="progress-header">
        <strong>提取進度</strong>
        <span id="progressPercentage">0%</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill"></div>
        </div>
      </div>
      <div class="info-text" id="progressText">
        準備開始提取...
      </div>
    </div>
    </div>

    <!-- 結果展示區域 -->
    <div class="status-card" id="resultsContainer" style="display: none;">
      <div class="results-header">
        <strong>提取結果</strong>
      </div>
      <div class="info-text">
        <strong>已提取書籍:</strong> <span id="extractedBookCount">0</span> 本<br>
        <strong>提取時間:</strong> <span id="extractionTime">-</span><br>
        <strong>成功率:</strong> <span id="successRate">-</span>
      </div>
      <div class="action-buttons">
        <button class="button secondary small" id="exportBtn" disabled>
          匯出資料
        </button>
        <button class="button secondary small" id="viewResultsBtn" disabled aria-label="查看詳細的提取結果">
          查看結果
        </button>
      </div>
    </div>

    <!--
      匯入結果 / 匯入錯誤卡片掛載點。
      由 popup.js 於初始化時以 src/core/ui/components/ui-factory.js
      的 createCard / createButton 動態建立並掛載於此（ticket 1.2.0-W2-003.2）。
    -->
    <div id="importPanelMount"></div>

    <!-- 系統初始載入錯誤 -->
    <div class="status-card error-card" id="initErrorContainer" style="display: none;">
      <div class="error-header">
        <strong>系統初始化失敗</strong>
      </div>
      <div class="error-message" id="initErrorMessage">
        擴充功能初始化過程中發生錯誤
      </div>
      <div class="action-buttons">
        <button class="button primary small" id="forceReloadBtn">
          強制重新載入擴充功能
        </button>
        <button class="button secondary small" id="openExtensionPageBtn">
          開啟擴充功能管理頁面
        </button>
      </div>
    </div>

    <!-- 頁面資訊：內容併進上方情境區，元素保留供既有寫入點使用 -->
    <div class="page-info" hidden>
      <span id="pageInfo">檢測中...</span>
      <span id="extensionStatus">-</span>
    </div>
  </div>

  <div class="version" id="versionDisplay">
    載入中...
  </div>

  <!--
    W4-006.2 重構（合併 popup 4 檔為單一 entry，esbuild 自動 bundle）：

    原本 popup-error-handler.js / popup-diagnostic-enhancer.js /
    popup-initialization-tracker.js 三檔以獨立 <script> tag 載入，造成 classic
    script 跨檔 global lexical record 衝突（W1-117 的 `let Logger` 與其他兩檔的
    `var Logger` 在同一 page 重複宣告 → parse-time SyntaxError）。

    現改由 popup.js require 三檔，esbuild 在 build 階段自動 bundle 進 popup.js
    IIFE，每檔 closure scope 獨立，徹底消除衝突。三檔的 window.Popup* 顯式注入
    保留，使 popup.js typeof 檢查可命中。

    popup-ui-components.js 維持獨立 <script> tag（無 Logger/ErrorCodes 跨檔宣告，
    不在本次重構範圍）。
  -->
  <script src="popup-ui-components.js"></script>
  <script src="popup.js"></script>
</body>
</html>
